source = ~/.config/hypr/keybinds.conf

##############
### NVIDIA ###
##############
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct   # nvidia-vaapi-driver: use the modern DRM/PRIME backend (no EGL), better on Wayland
# NOTE: VA-API HW video decode works here (verified with `mpv --hwdec=vaapi-copy` -> "Using hardware decoding").
# Don't trust nvtop's DEC gauge / nvidia-smi "Decoder %" on this RTX 4080 (Ada) — NVML under-reports decode util,
# so it reads 0% even mid-decode. Confirm via the app instead (mpv log, Firefox MOZ_LOG, chrome://media-internals).

cursor {
    no_hardware_cursors = true
}

################
### MONITORS ###
################
monitor=,preferred,auto,1.5

# Mitigate mixed DPI issues with XWayland apps.
# You'll need to scale via platform specific settings to get back to the desired size.
xwayland {
    force_zero_scaling = true
}

#################
### AUTOSTART ###
#################
# Bring up a systemd session so xdg-desktop-portal starts (fixes Flatpak dark theme,
# file pickers, screenshare). dbus line ensures portals spawn with the Wayland socket.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user start hyprland-session.target

# exec-once = nm-applet &
exec-once = waybar & hyprpaper
exec-once = swaync
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
exec-once = fcitx5

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_SCALE_FACTOR,1.5
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland
env = GDK_SCALE,2
env = GDK_GL,gles
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = EDITOR,nvim
env = MOZ_ENABLE_WAYLAND,1
# env = LC_CTYPE,ja
# env = FC_LANG,ja
# env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Dracula"   # for GTK3 apps
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"   # for GTK4 apps
exec-once = gsettings set org.gnome.desktop.interface cursor-theme "Bibata-Modern-Ice"
exec-once = gsettings set org.gnome.desktop.wm.preferences button-layout ":close"
# env = GTK_THEME,Tokyonight-Dark
env = QT_QPA_PLATFORMTHEME,gtk3   # Qt apps  follow the GTK/Dracula dark theme
# env = QT_QPA_PLATFORMTHEME,qt6ct 

#####################
### LOOK AND FEEL ###
#####################
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = master

    # snap {
    #     enabled = true
    # }
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 14

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.95

    shadow {
        enabled = false
        range = 12
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 3
        popups = true
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true
    enable_anr_dialog = false
    focus_on_activate = false
    force_default_wallpaper = 0
}

layerrule = blur on, match:title rofi
layerrule = ignore_alpha 0.1, match:title rofi

# Be sure that the background colors in sway have an alpha greater than 0
layerrule = blur on, match:title swaync-notification-window
layerrule = ignore_alpha 0.1, match:title swaync-notification-window
layerrule = blur on, match:title swaync-control-center
layerrule = ignore_alpha 0.1, match:title swaync-control-center


#############
### INPUT ###
#############
# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = gb
    # kb_options = caps:swapescape # Handled in keyboard config for now.
    # kb_variant = ,
    kb_model =
    kb_rules =
    repeat_delay = 200
    repeat_rate = 80

    follow_mouse = 2
    float_switch_override_focus = 0

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

##############################
### WINDOWS AND WORKSPACES ###
##############################
# https://wiki.hyprland.org/Configuring/Window-Rules/
# https://wiki.hyprland.org/Configuring/Workspace-Rules/
# windowrule = float on, match:class .*
# windowrule = border_size 0, floating:1, onworkspace:s[true]
windowrule = float on, match:workspace 3
windowrule = float on, match:title ^(fsearch|Calculator|Qalculate|Preferences)$

windowrule = float on, match:class org.gnome.Nautilus
windowrule = center on, match:class org.gnome.Nautilus
windowrule = size 60% 60%, match:class org.gnome.Nautilus

windowrule = float on, match:class org.keepassxc.KeePassXC
windowrule = size 30% 60%, match:class org.keepassxc.KeePassXC

windowrule = float on, match:class ^(imv)$
windowrule = size 70% 70%, match:class ^(imv)$
windowrule = center on, match:class ^(imv)$

windowrule = float on, match:class gcr-prompter

windowrule = fullscreen on, match:class ^(match:class org.tildearrow.furnace|com.bitwig.BitwigStudi|dev.zed.Zed)
windowrule = fullscreen on, match:title Renoise \(x86_64\)

# windowrule = workspace 1, match:class ^(org.wezfurlong.wezterm|kitty)$
windowrule = workspace 2, match:title ^(WorkFlowy)$
windowrule = workspace 3, match:class ^(Houdini FX|houdini_launcher|blender|Renoise|com.bitwig.BitwigStudi|org.tildearrow.furnace|dev.zed.Zed)$
windowrule = workspace 5, match:class ^(mpv|harmonoid|org.gnome.Rhythmbox3|ColinDuquesnoy.gitlab.com.MellowPlayer)
windowrule = workspace 7, match:class org.gnome.Calendar
windowrule = workspace 8, match:class com.discordapp.Discord
windowrule = workspace 9, match:class Vivaldi-flatpak
windowrule = workspace 10, match:class org.mozilla.firefox

windowrule = float on, match:workspace magic

# Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppressevent maximize, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# Trying to get firefox fullscreen within a window. Hyprland's old "fakefullscreen"
# windowrule = fullscreenstate 1, match:class .org.mozilla.firefox
# windowrule = syncfullscreen 0,match:class (firefox)
