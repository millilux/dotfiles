[tool.ruff] 
line-length = 88
extend-exclude = ["**/settings/*", "**/snapshots/*", "**/migrations/*"]

[tool.ruff.format]
preview = true
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
preview = true
select = [
    "E", "W", # pycodestyle
    "F", # pyflakes
    "G", # flake-8-logging-format
    "I", # isort
    "C", # mccabe
    "D", # pydocstyle
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "TID252", # Ban non-explicit relative imports
    "T201", # Ban print statements
]
ignore = [
    "E203", "E501", 
    "B904", # May reinstate - requires a lot of code change
    "D100", 
    "SIM108",
    # Mandatory docstrings
    "D100", "D101", "D102", "D103", "D104", "D105", "D106",
]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "single"

[tool.ruff.lint.mccabe]
max-complexity = 7

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-third-party = [
    "django",
    "flask",
    "freezegun",
    "sanic",
    "rest_framework",
    "pytest",
    "pytest_appium",
]

[tool.mypy]
enable_error_code = ["unused-awaitable", "redundant-self", "exhaustive-match", "ignore-without-code"]
