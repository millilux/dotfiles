unbind C-b

# Use C-a to avoid clobbering vim's Ctrl+B
set -g prefix C-a
# C-a C-a sends a literal C-a through to the app (fish beginning-of-line, nvim increment).
bind C-a send-prefix

# Reload config (capital R; lowercase r is rename-window below).
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Fuzzy jump to a project session (opens sessionizer in a scratch window).
bind f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# New session, switching the current client straight into it (no nesting —
# the server creates it, unlike a shell `tmux new-session`). Auto-named; rename
# with prefix $ (Alt+Shift+R). Injected by wezterm as Alt+Shift+T.
bind T new-session

# Fix mouse scroll
setw -g mouse on
# Allow mouse to select which pane to use
#set -g mouse-select-pane on

# set-option -g default-shell $SHELL
set -g escape-time 5 

# tmux-256color advertises italics (sitm/ritm); screen-256color does not.
set -g default-terminal "tmux-256color"
# Tell tmux the outer terminal (Wezterm) supports 24-bit truecolor.
set -as terminal-features ",xterm-256color*:RGB"

set -g status-keys vi
setw -g mode-keys vi

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

bind v split-window -h
bind s split-window -v

# When renaming a window, don't pre-populate the name
bind r command-prompt "rename-window '%%'"

# Use 1 instead of 0 for the first pane + window index 
set -g base-index 1
setw -g pane-base-index 1

# Keep window numbers gapless so Alt+1..9 (prefixless select) stay stable.
set -g renumber-windows on
# set -g automatic-rename on

# setw -g window-status-format "#[bg=default,fg=colour8] #W [#I] "
# setw -g window-status-current-format "#[bg=default,fg=colour7] #W [#I] "

set -g status-position bottom
set -g status-style bg=default

# Three-zone status bar, built as a single status-format[0] template. This is
# the only way to get a centre element independent of the window list, since
# status-justify can only position the native window list (not a second field).
# It supersedes status-left / status-right / status-justify / window-status-*.
#
#   left   = window glyphs  ◆ current / ◇ other   — looked at most, so nearest edge
#   centre = current session name, faint (colour8)
#   right  = session glyphs ● this client's session / ○ others — glanced at least
#            (circles = sessions, the "bigger" entity; diamonds = windows)
#
# Each glyph row is built with a loop modifier and only appears when there is
# more than one item, so a plain single-window/single-session bar shows just the
# centred name:
#   #{W:OTHER,CURRENT}  loops windows (2nd arg is the CURRENT window, not the 1st);
#   #{S:...}  loops sessions.
#   #{?#{>:#{session_windows},1},…,}  and  #{?#{>:#{server_sessions},1},…,}  guard each row.
#   #{==:#{session_name},#{client_session}}  marks the session THIS client is on
#     (per-bar), not session_attached (true for every session with any client).
#
# Two tmux gotchas baked into the ordering here:
#   1. A #[style] with a comma (e.g. #[bg=default,fg=…]) must sit OUTSIDE any
#      #{?…} — the conditional splits on commas and would swallow the glyph.
#      Hence single-attribute #[fg=colourN] styles inside the loops.
#   2. Referencing an option (#{window-status-current-format}) does NOT re-expand
#      a nested #{?…} inside it, so the glyph formats are inlined here directly.
set -g status-format[0] "#[align=left]  #{?#{>:#{session_windows},1},#{W:#[fg=colour8]◇ ,#[fg=colour7]◆ },}#[align=centre]#[fg=colour8]#{client_session}#[align=right]#{?#{>:#{server_sessions},1},#{S:#{?#{==:#{session_name},#{client_session}},#[fg=colour7]●,#[fg=colour8]○} },} "

set -g pane-active-border-style fg=default,bg=default
set -g pane-border-style fg=default,bg=default

