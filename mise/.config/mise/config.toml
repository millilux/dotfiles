# ~/.config/mise/config.toml — GLOBAL toolchain (this dotfiles repo).
#
# One cross-platform source of truth for language runtimes AND editor tooling
# (LSPs, formatters, linters). Backends resolve to the same upstream binaries on
# Fedora and macOS, so nvim/helix/shell/CI all see identical tools on both boxes.
#
# Layering: per-project `mise.toml` files override this (runtime version pins,
# CI-parity linter pins). GLOBAL = daily-driver runtimes + every LSP the editor
# needs everywhere. PROJECT = "this repo needs node 20 / ruff 0.6.9".

[tools]
# ── Language runtimes ────────────────────────────────────────────────────────
node   = "latest"
# postinstall provisions nvim's python3 host into the interpreter being installed,
# so a `latest` bump arrives with the provider working instead of dead until
# setup.sh reruns. Fires on fresh installs only: after editing requirements.txt,
# run `pip3 install -r` against it by hand.
# NB {{config_root}} is $HOME for a global config, not this directory — hence xdg.
python = { version = "latest", postinstall = "pip3 install -r {{xdg_config_home}}/mise/requirements.txt" }
rust   = "latest"
go     = { version = "latest", postinstall = "go telemetry off" }
zig    = "latest"
erlang = "latest"
elixir = "latest"
gleam  = "latest"
elm    = "latest"

# Toolchain managers — bootstrap their own ecosystems, so their LSPs are built in
# setup.sh instead: opam→ocaml-lsp, ghcup→haskell-language-server.
opam = "latest"
ghcup = "latest"
uv   = "latest"   # Python packaging + uvx; also backs the pipx: tools below

# ── Standalone-binary tooling (aqua/ubi: one relocatable binary, no runtime) ──
lua-language-server = "latest"
rust-analyzer       = "latest"
shfmt      = "latest"
shellcheck = "latest"            # shell linter; bash-language-server surfaces its diagnostics
stylua     = "latest"
ruff     = "0.6.9"               # pinned for work CI parity; unpin when work moves
starship = "latest"
yazi     = "latest"
tree-sitter = "latest"   # CLI used by nvim-treesitter (main branch) to compile parsers

# Portable CLI tools. These are Tier 2: one version on Fedora and macOS, so they
# are deliberately absent from fedora-packages.txt and the Brewfile — a second
# copy from dnf or brew would shadow these on PATH.
bat      = "latest"
eza      = "latest"
fd       = "latest"
fzf      = "latest"
gh       = "latest"
delta    = "latest"              # registry name for git-delta
ripgrep  = "latest"
zoxide   = "latest"
jq       = "latest"
sops     = "latest"
ast-grep = "latest"
aws-iam-authenticator = "latest"
"ubi:clangd/clangd"               = "latest"   # C/C++ LSP, standalone LLVM release
"ubi:nolanderc/glsl_analyzer"     = "latest"
"ubi:wgsl-analyzer/wgsl-analyzer" = "latest"

# ── npm-based language servers (npm: backend, each isolated) ──────────────────
"npm:typescript-language-server"   = "latest"
"npm:typescript"                   = "latest"   # tsserver; peer of the above
"npm:bash-language-server"         = "latest"
"npm:yaml-language-server"         = "latest"
"npm:vscode-langservers-extracted" = "latest"   # html/css/json/eslint servers
"npm:graphql-language-service-cli" = "latest"
"npm:@rescript/language-server"    = "latest"
"npm:prettier"                     = "latest"
"npm:neovim"                       = "latest"   # node host for nvim's node provider

# ── Python tooling (pipx: backend, each in its own isolated venv) ─────────────
# mypy is the authoritative type checker (editor and CI must agree), so it lives
# here and nowhere else — see requirements.txt.
"pipx:mypy"            = "latest"   # standalone mypy for shell/CI use
# pylsp needs its plugins importable from its OWN venv, so they go in uvx_args
# rather than being separate [tools] entries — those would each get their own
# venv, where pylsp could not see them. mise exposes only the `pylsp` binary,
# so the venv's bundled mypy/ruff stay off $PATH and cannot shadow the pins above.
#
# mise does NOT rebuild when this line changes. After editing:
#   mise uninstall pipx:python-lsp-server && mise install
"pipx:python-lsp-server" = { version = "latest", uvx_args = "--with pylsp-mypy --with python-lsp-ruff --with pylsp-rope" }
"pipx:visidata"       = "latest"
"pipx:git-when-merged" = "latest"

# ── Language-server plugins managed as mise plugins ──────────────────────────
elixir-ls = "latest"
