# More option see https://github.com/DreamMaoMao/mango/wiki/

monitor_rule=serial:41CQ413,scale:1.5
xwayland_ignore_scale=1

# Environment
# XDG_CURRENT_DESKTOP is set by mango itself (mango-portals.conf depends on it)
env=LIBVA_DRIVER_NAME,nvidia
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=NVD_BACKEND,direct
# env=WLR_NO_HARDWARE_CURSORS,1
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GDK_SCALE,2
env=GDK_GL,gles
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=MOZ_ENABLE_WAYLAND,1
env=EDITOR,nvim

# Autostart
# DMS provides bar, wallpaper, notifications, lock and polkit agent
exec_once=dms run
exec_once=fcitx5

# Window effect
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 3
blur_params_radius = 3
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color= 0x000000ff

border_radius=14
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=0.95

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.5,0.5,0.5,0.5
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=10
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=0

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5
title_message_bar_height=52
title_message_bar_gap=20

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=0
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=0
warp_cursor=1
focus_cross_monitor=0
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
cursor_theme=Bibata-Modern-Ice
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=80
repeat_delay=200
numlock_on=0
xkb_rules_layout=gb

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=2
root_color=0x201b14ff
border_color=0x595959aa
drop_color=0x8FBA7C55
split_color=0xEB441EFF
focus_color=0x33ccffee
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:tile
tag_rule=id:6,layout_name:tile
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile
tag_rule=id:10,layout_name:tile
tag_rule=id:3,open_as_floating:1

# Window Rules
window_rule=is_floating:1,app_id:^com\.danklinux\.dms$
window_rule=is_floating:1,title:^(fsearch|Calculator|Qalculate|Preferences)$
window_rule=is_floating:1,width:0.6,height:0.6,app_id:^org\.gnome\.Nautilus$
window_rule=is_floating:1,width:0.3,height:0.6,app_id:^org\.keepassxc\.KeePassXC$
window_rule=is_floating:1,app_id:^com\.vixalien\.sticky$
window_rule=is_floating:1,width:0.7,height:0.7,app_id:^imv$
window_rule=is_floating:1,app_id:^gcr-prompter$

window_rule=is_fullscreen:1,app_id:^(org\.tildearrow\.furnace|com\.bitwig\.BitwigStudi|dev\.zed\.Zed)
window_rule=is_fullscreen:1,title:Renoise \(x86_64\)

window_rule=tags:2,title:^WorkFlowy$
window_rule=tags:3,app_id:^(Houdini FX|houdini_launcher|blender|Renoise|com\.bitwig\.BitwigStudi|org\.tildearrow\.furnace|dev\.zed\.Zed)$
window_rule=tags:5,app_id:^(mpv|harmonoid|org\.gnome\.Rhythmbox3|ColinDuquesnoy\.gitlab\.com\.MellowPlayer)
window_rule=tags:7,app_id:^org\.gnome\.Calendar$
window_rule=tags:8,app_id:^com\.discordapp\.Discord$
window_rule=tags:9,app_id:^Vivaldi-flatpak$
window_rule=tags:10,app_id:^org\.mozilla\.firefox$

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
# ALT and CTRL-only combos are left free for apps (wezterm's Alt->tmux layer, browser tabs, word motions), except ALT+Tab

bind=SUPER,r,reload_config
bind=SUPER+CTRL+SHIFT,q,quit
bind=SUPER,q,killclient,

# programs
bind=SUPER,Return,spawn,wezterm
bind=SUPER,e,spawn,nautilus
bind=SUPER,b,spawn,firefox
bind=SUPER,space,spawn,rofi -show drun
bind=SUPER,i,spawn_shell,imv ~/Pictures
bind=SUPER,o,spawn,wezterm start -- fish -lc tmux-sessionizer

# window state
bind=SUPER,f,togglefloating,
bind=SUPER+SHIFT,m,togglefullscreen,
bind=SUPER+ALT,m,togglefakefullscreen,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,g,toggleglobal,
bind=SUPER,w,togglejump,
bind=ALT,Tab,switcher,all_tag_next
bind=ALT+SHIFT,Tab,switcher,all_tag_prev
bind=SUPER+SHIFT,space,switch_layout

# focus
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# move
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,j,move_client,down

# resize (tiled and floating)
bind=SUPER+CTRL,h,resizewin,-50,+0
bind=SUPER+CTRL,l,resizewin,+50,+0
bind=SUPER+CTRL,k,resizewin,+0,-50
bind=SUPER+CTRL,j,resizewin,+0,+50

# tags
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER,0,view,10,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0
bind=SUPER+SHIFT,0,tag,10,0

bind=SUPER,Tab,viewtoright_have_client,0
bind=SUPER+SHIFT,Tab,viewtoleft_have_client,0

# special tag (scratchpad)
bind=SUPER,s,toggle_special_tag
bind=SUPER+SHIFT,s,tag_special_tag

# shell
bind=CTRL+ALT,q,spawn,dms ipc call lock lock
bind=SUPER,n,spawn,dms ipc call notifications toggle
bind=SUPER+SHIFT,c,spawn,hyprpicker -a

# media
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl s 10%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# voice: release only matches while SUPER is still held, so let go of D first
bindc=SUPER,d,spawn,voxtype record start
bindrc=SUPER,d,spawn,voxtype record stop

# screenshots
bind=NONE,Print,spawn,dms screenshot full
bind=SUPER,Print,spawn,dms screenshot window
bind=SUPER+SHIFT,Print,spawn,dms screenshot region

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview


# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi
